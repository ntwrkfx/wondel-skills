interface:
  display_name: "Create a Business"
  short_description: "Validate and shape a new business"
  default_prompt: >-
    Run this guided journey. If no writable workspace is available, use chat mode:
    maintain structured journey state in the conversation, present complete Markdown
    artifacts for approval, and never claim files were written. If a writable workspace
    is available, use the documented docs/ artifacts and resume tracker.

policy:
  products:
    - CHAT
    - CODEX
  allow_implicit_invocation: false

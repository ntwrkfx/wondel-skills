name: OpenAI compatibility

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate ChatGPT and Codex plugins
        run: ./scripts/generate-codex-plugins.sh

      - name: Validate OpenAI compatibility
        run: python3 ./scripts/validate-openai-compat.py

      - name: Verify generated plugin files are committed
        run: git diff --exit-code -- .agents/plugins plugins
